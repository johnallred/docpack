# Prose style enforced in CI. See docs/how-to/wire-up-ci.md.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Showcase

# Front matter is structured data, not prose.
BlockIgnores = (?s)^---\n.*?\n---

# Numbered step headings are exempt from sentence case.
[docs/tutorials/*.md]
Showcase.HeadingCase = NO
